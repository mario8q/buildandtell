{% extends 'registration/_auth_base.html' %}

{% block title %}logged out · Build&Tell{% endblock title %}

{% block auth_call %}
    <span class="create__fn">user</span><span class="create__callee">.logout()</span>
{% endblock auth_call %}

{% block auth_body %}
    <div class="auth__done">
        <p class="auth__code"><span class="auth__ok">&gt;</span> session ended successfully</p>
        <p class="auth__hint">You are now logged out.</p>
        <div class="form__actions">
            <a class="btn" href="{% url 'login' %}">log back in &nearr;</a>
            <a class="btn btn--ghost" href="{% url 'projects:project_list' %}">projects</a>
        </div>
    </div>
{% endblock auth_body %}
